<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Conversor A/V Local</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Conversor A/V Local</h1>
    <p class="subtitle">Converte MP4 ⇄ MP3 sem enviar nada para a internet.</p>

    <label class="file-label" for="fileInput">
      <span id="fileNameText">Escolher arquivo (.mp4 ou .mp3)</span>
    </label>
    <input type="file" id="fileInput" accept=".mp4,.mp3,video/mp4,audio/mpeg" />

    <div class="buttons">
      <button id="toMp3Btn" disabled>Converter para MP3</button>
      <button id="toMp4Btn" disabled>Converter para MP4</button>
    </div>

    <div class="progress-wrap" id="progressWrap" hidden>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p id="statusText">Carregando conversor...</p>
    </div>

    <a id="downloadLink" class="download-link" hidden download>Baixar resultado</a>
  </main>

  <!-- ffmpeg.js precisa ser um <script> normal (não module) para detectar sozinho
       a pasta onde está e achar o worker "814.ffmpeg.js" ao lado dele. -->
  <script src="ffmpeg/ffmpeg.js"></script>
  <script src="popup.js"></script>
</body>
</html>
